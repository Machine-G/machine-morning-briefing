name: Machine Morning Briefing RSS
on:
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * *' # 08:15 JST (UTC 23:15 previous day)
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Python collector
        env:
          MMB_KEYWORDS_API: https://machine-morning-briefing-api.tnk929.workers.dev/api/collector/keywords
          MMB_COLLECTOR_TOKEN: ${{ secrets.MMB_COLLECTOR_TOKEN }}
        run: python collector.py
      - name: Commit generated edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add morning.html articles.json
          git diff --cached --quiet || (git commit -m "Update morning briefing" && git push)
